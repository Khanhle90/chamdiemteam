<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chấm Điểm Team Building</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body { -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, sans-serif; }
    .turn-locked { opacity: 0.45; cursor: not-allowed; text-decoration: line-through; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen pb-20">

  <!-- HEADER -->
  <header class="bg-indigo-700 text-white px-4 py-3 shadow-md sticky top-0 z-30 flex items-center justify-between">
    <div>
      <h1 class="font-bold text-base tracking-wide uppercase flex items-center gap-2">
        <i class="fa-solid fa-stopwatch text-amber-300"></i> Team Building Score
      </h1>
      <p id="activeMatchLabel" class="text-xs text-indigo-200 mt-0.5">Đang kết nối máy chủ...</p>
    </div>
    <button onclick="fetchData(true)" class="bg-indigo-600 active:bg-indigo-800 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 border border-indigo-400">
      <i id="syncIcon" class="fa-solid fa-rotate"></i> Đồng bộ
    </button>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-md mx-auto p-3">

    <!-- TAB 1: CHẤM ĐIỂM -->
    <section id="tab-score" class="space-y-4">
      <div class="bg-white rounded-2xl shadow-sm p-4 border border-slate-200 space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase text-slate-600 mb-1.5">1. Chọn Đội Chơi <span class="text-red-500">*</span></label>
          <div id="teamButtonsContainer" class="grid grid-cols-2 gap-2"></div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-slate-600 mb-1.5">2. Chế Độ Chấm <span class="text-red-500">*</span></label>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" onclick="selectMode('Tính giờ')" id="mode-TinhGio" class="mode-btn py-2.5 px-2 rounded-xl font-bold text-xs border-2 transition flex flex-col items-center gap-1"><i class="fa-solid fa-stopwatch text-base"></i> Tính giờ</button>
            <button type="button" onclick="selectMode('Đếm số')" id="mode-DemSo" class="mode-btn py-2.5 px-2 rounded-xl font-bold text-xs border-2 transition flex flex-col items-center gap-1"><i class="fa-solid fa-layer-group text-base"></i> Đếm số</button>
            <button type="button" onclick="selectMode('Thêm điểm')" id="mode-ThemDiem" class="mode-btn py-2.5 px-2 rounded-xl font-bold text-xs border-2 transition flex flex-col items-center gap-1"><i class="fa-solid fa-circle-plus text-base"></i> Thêm điểm</button>
          </div>
        </div>

        <div id="turnSection">
          <div class="flex justify-between items-center mb-1.5">
            <label class="text-xs font-bold uppercase text-slate-600">3. Lượt Chơi <span class="text-red-500">*</span></label>
            <span id="turnStatusHint" class="text-[11px] text-indigo-600 font-medium">Khóa lượt đã chấm</span>
          </div>
          <div id="turnButtonsContainer" class="grid grid-cols-6 gap-1.5"></div>
        </div>

        <div id="foulSection" class="pt-1">
          <label class="flex items-center justify-between p-3 rounded-xl border-2 border-red-200 bg-red-50/60 cursor-pointer">
            <div class="flex items-center gap-2.5">
              <i class="fa-solid fa-triangle-exclamation text-red-600 text-lg"></i>
              <div>
                <div class="text-sm font-bold text-red-700">Phạm Quy (0 điểm)</div>
                <div class="text-[11px] text-red-500">Tự động gán 0đ</div>
              </div>
            </div>
            <input type="checkbox" id="foulCheckbox" onchange="updateInputVisibility()" class="w-5 h-5 accent-red-600 rounded" />
          </label>
        </div>

        <div id="timeInputsSection" class="space-y-3">
          <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Thời gian (Giây) <span class="text-red-500">*</span></label>
            <input type="number" step="0.01" id="inputSeconds" placeholder="VD: 45.5" class="w-full px-3.5 py-3 text-lg font-bold rounded-xl border-2 border-slate-300 focus:border-indigo-600 focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Số thành viên <span class="text-slate-400 font-normal">(Tùy chọn)</span></label>
            <input type="number" id="inputMembers" placeholder="Để trống nếu tính tổng cả đội" class="w-full px-3.5 py-2.5 text-sm font-semibold rounded-xl border-2 border-slate-200 focus:border-indigo-600 focus:outline-none" />
          </div>
        </div>

        <div id="countInputsSection" class="hidden">
          <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Số lượng đếm <span class="text-red-500">*</span></label>
          <input type="number" id="inputCount" placeholder="Nhập số lượng..." class="w-full px-3.5 py-3 text-lg font-bold rounded-xl border-2 border-slate-300 focus:border-indigo-600 focus:outline-none" />
        </div>

        <div id="directPointsSection" class="hidden space-y-2">
          <label class="block text-xs font-bold uppercase text-slate-600">Điểm cộng trực tiếp <span class="text-red-500">*</span></label>
          <div class="grid grid-cols-4 gap-2 mb-2">
            <button type="button" onclick="setDirectPoint(10)" class="py-2 bg-emerald-50 border border-emerald-300 rounded-lg font-bold text-emerald-700 text-xs">+10đ</button>
            <button type="button" onclick="setDirectPoint(20)" class="py-2 bg-emerald-50 border border-emerald-300 rounded-lg font-bold text-emerald-700 text-xs">+20đ</button>
            <button type="button" onclick="setDirectPoint(30)" class="py-2 bg-emerald-50 border border-emerald-300 rounded-lg font-bold text-emerald-700 text-xs">+30đ</button>
            <button type="button" onclick="setDirectPoint(50)" class="py-2 bg-emerald-50 border border-emerald-300 rounded-lg font-bold text-emerald-700 text-xs">+50đ</button>
          </div>
          <input type="number" id="inputDirectPoints" value="10" class="w-full px-3.5 py-3 text-lg font-bold rounded-xl border-2 border-slate-300 focus:border-indigo-600 focus:outline-none" />
        </div>

        <button type="button" id="submitBtn" onclick="submitScore()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold rounded-xl shadow-md text-base flex items-center justify-center gap-2 transition">
          <i class="fa-solid fa-paper-plane"></i> LƯU ĐIỂM NGAY
        </button>
      </div>
    </section>

    <!-- TAB 2: NHẬT KÝ LIVE FEED -->
    <section id="tab-feed" class="hidden space-y-2.5">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-xs font-bold uppercase text-slate-500">Dòng chảy điểm trực tiếp</h2>
        <span id="logCountBadge" class="text-xs bg-indigo-100 text-indigo-700 font-bold px-2 py-0.5 rounded-full">0 lượt</span>
      </div>
      <div id="liveFeedContainer" class="space-y-2"></div>
    </section>

    <!-- TAB 3: BẢNG XẾP HẠNG -->
    <section id="tab-leaderboard" class="hidden space-y-3">
      <h2 class="text-xs font-bold uppercase text-slate-500 px-1">Bảng xếp hạng tổng điểm</h2>
      <div id="leaderboardContainer" class="space-y-2.5"></div>
    </section>

    <!-- TAB 4: QUẢN TRỊ (BẢO MẬT MÃ PIN 8888) -->
    <section id="tab-admin" class="hidden space-y-4">
      <div id="adminLockScreen" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center space-y-3">
        <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">
          <i class="fa-solid fa-lock"></i>
        </div>
        <h3 class="font-bold text-base text-slate-800">Khu Vực Quản Trị Bảo Mật</h3>
        <p class="text-xs text-slate-500">Nhập mã PIN Ban Tổ Chức (Mặc định: 8888)</p>
        <div class="flex gap-2 max-w-xs mx-auto pt-2">
          <input type="password" id="adminPinInput" placeholder="Mã PIN..." class="flex-1 px-3 py-2 border rounded-xl text-center font-bold tracking-widest text-sm focus:outline-none focus:border-indigo-600" />
          <button onclick="unlockAdmin()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold">Mở khóa</button>
        </div>
      </div>

      <div id="adminContent" class="hidden space-y-4">
        <div class="bg-indigo-50 p-3 rounded-xl border border-indigo-200 flex justify-between items-center">
          <span class="text-xs font-bold text-indigo-900"><i class="fa-solid fa-shield-halved text-indigo-600"></i> Đã mở khóa Quản Trị</span>
          <button onclick="lockAdminAgain()" class="text-xs text-red-600 font-semibold underline">Khóa lại</button>
        </div>

        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
          <h3 class="font-bold text-sm text-slate-800"><i class="fa-solid fa-users-gear text-indigo-600 mr-1"></i> Thêm Đội Chơi</h3>
          <div class="flex gap-2">
            <input type="text" id="newTeamName" placeholder="Tên đội..." class="flex-1 px-3 py-2 border rounded-xl text-sm" />
            <input type="color" id="newTeamColor" value="#ef4444" class="w-11 h-10 p-1 border rounded-xl cursor-pointer" />
            <button onclick="createNewTeam()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold">Thêm</button>
          </div>
        </div>

        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
          <h3 class="font-bold text-sm text-slate-800"><i class="fa-solid fa-flag-checkered text-indigo-600 mr-1"></i> Quản Lý Trận Đấu</h3>
          <div class="flex gap-2">
            <input type="text" id="newMatchName" placeholder="Tên trận mới..." class="flex-1 px-3 py-2 border rounded-xl text-sm" />
            <button onclick="createNewMatch()" class="bg-emerald-600 text-white px-3.5 py-2 rounded-xl text-xs font-bold">Mở trận mới</button>
          </div>
          <div id="matchListAdmin" class="space-y-2 pt-2"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- TOAST -->
  <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-lg hidden z-50"></div>

  <!-- BOTTOM NAVIGATION -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around py-2 z-40 max-w-md mx-auto">
    <button onclick="switchTab('score')" id="nav-score" class="flex flex-col items-center text-indigo-600 font-bold text-xs"><i class="fa-solid fa-pen-to-square text-lg mb-0.5"></i> Chấm điểm</button>
    <button onclick="switchTab('feed')" id="nav-feed" class="flex flex-col items-center text-slate-400 font-medium text-xs"><i class="fa-solid fa-bolt text-lg mb-0.5"></i> Nhật ký Live</button>
    <button onclick="switchTab('leaderboard')" id="nav-leaderboard" class="flex flex-col items-center text-slate-400 font-medium text-xs"><i class="fa-solid fa-trophy text-lg mb-0.5"></i> Xếp hạng</button>
    <button onclick="switchTab('admin')" id="nav-admin" class="flex flex-col items-center text-slate-400 font-medium text-xs"><i class="fa-solid fa-sliders text-lg mb-0.5"></i> Quản trị</button>
  </nav>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyIAa7X6S09izY9VRbWdydNe7yi9cB0EWoJLR2qyFDk5QdM-WMIK5W0_hiwYx8sZpGG/exec";
    const ADMIN_PIN = "8888";

    const ALL_TURNS = ["L1", "L2", "L3", "L4", "L5", "L6"];
    let appState = { activeMatch: null, matches: [], teams: [], logs: [] };
    let selectedTeamId = "";
    let selectedMode = "Tính giờ";
    let selectedTurn = "L1";
    let deviceId = localStorage.getItem("tb_device_id") || (() => {
      const id = "DEV_" + Math.random().toString(36).substring(2, 10).toUpperCase();
      localStorage.setItem("tb_device_id", id);
      return id;
    })();

    window.addEventListener("DOMContentLoaded", () => {
      selectMode("Tính giờ");
      fetchData(true);
      setInterval(() => fetchData(false), 8000);
    });

    function showToast(msg, isError = false) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = `fixed top-16 left-1/2 -translate-x-1/2 text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-lg z-50 ${isError ? 'bg-red-600' : 'bg-emerald-600'}`;
      t.classList.remove("hidden");
      setTimeout(() => t.classList.add("hidden"), 2500);
    }

    async function fetchData(showSpinner = false) {
      const icon = document.getElementById("syncIcon");
      if (showSpinner) icon.classList.add("fa-spin");
      try {
        const res = await fetch(SCRIPT_URL);
        appState = await res.json();
        renderAll();
      } catch (e) {
        console.error(e);
      } finally {
        if (showSpinner) icon.classList.remove("fa-spin");
      }
    }

    function renderAll() {
      const match = appState.activeMatch;
      document.getElementById("activeMatchLabel").textContent = match ? `Trận: ${match.name}` : "Không có trận Đang diễn ra";
      if (match) {
        const savedTeam = localStorage.getItem("tb_team_" + match.id);
        if (savedTeam && appState.teams.some(t => t.id === savedTeam)) selectedTeamId = savedTeam;
        else if (!selectedTeamId && appState.teams.length > 0) selectedTeamId = appState.teams[0].id;
      }
      renderTeamButtons();
      renderTurnButtons();
      renderLiveFeed();
      renderLeaderboard();
      renderAdmin();
    }

    function renderTeamButtons() {
      const container = document.getElementById("teamButtonsContainer");
      if (!appState.teams.length) {
        container.innerHTML = `<div class="col-span-2 text-xs text-slate-400 italic">Chưa có đội chơi.</div>`;
        return;
      }
      container.innerHTML = appState.teams.map(t => {
        const isSelected = t.id === selectedTeamId;
        return `
          <button type="button" onclick="selectTeam('${t.id}')" class="p-2.5 rounded-xl border-2 text-left transition flex items-center justify-between ${isSelected ? 'border-indigo-600 bg-indigo-50 text-indigo-900 font-bold shadow-sm' : 'border-slate-200 bg-white text-slate-700 font-medium'}">
            <span class="text-xs flex items-center gap-1.5 truncate"><span class="w-3 h-3 rounded-full inline-block shrink-0" style="background:${t.color}"></span>${t.name}</span>
            ${isSelected ? '<i class="fa-solid fa-circle-check text-indigo-600 text-sm"></i>' : ''}
          </button>
        `;
      }).join("");
    }

    function selectTeam(idDoi) {
      selectedTeamId = idDoi;
      if (appState.activeMatch) localStorage.setItem("tb_team_" + appState.activeMatch.id, idDoi);
      renderTeamButtons();
      renderTurnButtons();
    }

    function selectMode(mode) {
      selectedMode = mode;
      ["Tính giờ", "Đếm số", "Thêm điểm"].forEach(m => {
        const btnId = m === "Tính giờ" ? "mode-TinhGio" : (m === "Đếm số" ? "mode-DemSo" : "mode-ThemDiem");
        document.getElementById(btnId).className = m === mode
          ? "mode-btn py-2.5 px-2 rounded-xl font-bold text-xs border-2 border-indigo-600 bg-indigo-600 text-white shadow-sm flex flex-col items-center gap-1"
          : "mode-btn py-2.5 px-2 rounded-xl font-bold text-xs border-2 border-slate-200 bg-slate-50 text-slate-600 flex flex-col items-center gap-1";
      });
      const isRanked = (mode !== "Thêm điểm");
      document.getElementById("turnSection").classList.toggle("hidden", !isRanked);
      document.getElementById("foulSection").classList.toggle("hidden", !isRanked);
      if (!isRanked) document.getElementById("foulCheckbox").checked = false;
      updateInputVisibility();
      renderTurnButtons();
    }

    function getNextAllowedTurn() {
      if (!selectedTeamId || selectedMode === "Thêm điểm") return "L1";
      const usedTurns = appState.logs.filter(l => l.idDoi === selectedTeamId && l.cheDo === selectedMode).map(l => l.luotChoi);
      let maxIdx = -1;
      usedTurns.forEach(t => { const idx = ALL_TURNS.indexOf(t); if (idx > maxIdx) maxIdx = idx; });
      return (maxIdx + 1 < ALL_TURNS.length) ? ALL_TURNS[maxIdx + 1] : null;
    }

    function renderTurnButtons() {
      const container = document.getElementById("turnButtonsContainer");
      const nextTurn = getNextAllowedTurn();
      selectedTurn = nextTurn || "";
      const usedTurns = appState.logs.filter(l => l.idDoi === selectedTeamId && l.cheDo === selectedMode).map(l => l.luotChoi);
      let maxIdx = -1;
      usedTurns.forEach(t => { const idx = ALL_TURNS.indexOf(t); if (idx > maxIdx) maxIdx = idx; });

      container.innerHTML = ALL_TURNS.map((turn, idx) => {
        if (idx <= maxIdx) {
          return `<button type="button" disabled class="turn-locked py-2.5 rounded-xl border border-slate-300 bg-slate-200 text-slate-500 font-bold text-xs flex flex-col items-center"><span>${turn}</span><i class="fa-solid fa-lock text-[10px] mt-0.5"></i></button>`;
        } else if (turn === nextTurn) {
          return `<button type="button" onclick="selectedTurn='${turn}'" class="py-2.5 rounded-xl border-2 border-indigo-600 bg-indigo-600 text-white font-bold text-xs shadow-sm flex flex-col items-center"><span>${turn}</span><i class="fa-solid fa-check text-[10px] mt-0.5"></i></button>`;
        } else {
          return `<button type="button" disabled class="opacity-50 cursor-not-allowed py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-400 font-bold text-xs flex flex-col items-center"><span>${turn}</span><i class="fa-solid fa-hourglass-half text-[10px] mt-0.5"></i></button>`;
        }
      }).join("");
      document.getElementById("turnStatusHint").textContent = nextTurn ? `Mở: ${nextTurn}` : "Đã hoàn thành 6 lượt!";
    }

    function updateInputVisibility() {
      const isFoul = document.getElementById("foulCheckbox").checked;
      document.getElementById("timeInputsSection").classList.toggle("hidden", !(selectedMode === "Tính giờ" && !isFoul));
      document.getElementById("countInputsSection").classList.toggle("hidden", !(selectedMode === "Đếm số" && !isFoul));
      document.getElementById("directPointsSection").classList.toggle("hidden", selectedMode !== "Thêm điểm");
    }

    function setDirectPoint(val) { document.getElementById("inputDirectPoints").value = val; }

    async function submitScore() {
      if (!appState.activeMatch) return showToast("Không có trận Đang diễn ra!", true);
      if (!selectedTeamId) return showToast("Chọn đội chơi!", true);

      const isFoul = document.getElementById("foulCheckbox").checked;
      let thoiGianGiay = 0, soThanhVien = 0, soLuongDem = 0, diemTrucTiep = 0;

      if (selectedMode !== "Thêm điểm" && !selectedTurn) return showToast("Đã hết lượt chơi!", true);
      if (selectedMode === "Tính giờ" && !isFoul) {
        thoiGianGiay = parseFloat(document.getElementById("inputSeconds").value);
        soThanhVien = parseInt(document.getElementById("inputMembers").value) || 0;
        if (!thoiGianGiay || thoiGianGiay <= 0) return showToast("Nhập thời gian hợp lệ!", true);
      } else if (selectedMode === "Đếm số" && !isFoul) {
        soLuongDem = parseInt(document.getElementById("inputCount").value);
        if (!soLuongDem || soLuongDem <= 0) return showToast("Nhập số lượng đếm!", true);
      } else if (selectedMode === "Thêm điểm") {
        diemTrucTiep = parseInt(document.getElementById("inputDirectPoints").value);
        if (isNaN(diemTrucTiep) || diemTrucTiep === 0) return showToast("Nhập điểm cộng!", true);
      }

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ĐANG GỬI...`;

      try {
        localStorage.setItem("tb_team_" + appState.activeMatch.id, selectedTeamId);
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "ADD_SCORE", idDoi: selectedTeamId, cheDo: selectedMode,
            luotChoi: selectedMode === "Thêm điểm" ? "" : selectedTurn,
            thoiGianGiay, soThanhVien, soLuongDem, phamQuy: isFoul, diemTrucTiep, trongTai: deviceId
          })
        });
        const result = await res.json();
        if (result.status === "success") {
          appState = result.data;
          document.getElementById("inputSeconds").value = "";
          document.getElementById("inputMembers").value = "";
          document.getElementById("inputCount").value = "";
          document.getElementById("foulCheckbox").checked = false;
          updateInputVisibility();
          renderAll();
          showToast("Đã lưu điểm thành công!");
          switchTab("score");
        } else {
          showToast(result.message || "Lỗi lưu điểm!", true);
        }
      } catch (e) {
        showToast("Lỗi kết nối mạng!", true);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> LƯU ĐIỂM NGAY`;
      }
    }

    function renderLiveFeed() {
      const container = document.getElementById("liveFeedContainer");
      document.getElementById("logCountBadge").textContent = `${appState.logs.length} lượt`;
      if (!appState.logs.length) {
        container.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-xs text-slate-400">Chưa có lượt chấm điểm nào.</div>`;
        return;
      }
      container.innerHTML = appState.logs.map(log => `
        <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
          <div class="space-y-0.5">
            <div class="font-bold text-sm text-slate-800 flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full inline-block" style="background:${log.mauSac}"></span>${log.tenDoi}</div>
            <div class="text-xs font-semibold ${log.phamQuy ? 'text-red-600' : 'text-indigo-600'}">${log.hienThiNhatKy}</div>
            ${log.cheDo !== 'Thêm điểm' && !log.phamQuy ? `<div class="text-[11px] text-slate-400">TB: ${log.tgTrungBinh \vert{}\vert{} log.soLuongDem} • Hạng ${log.hangThuThach}</div>` : ''}
          </div>
          <span class="px-3 py-1 rounded-xl font-extrabold text-sm ${log.phamQuy ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'}">${log.phamQuy ? '0đ' : '+' + log.diemDatDuoc + 'đ'}</span>
        </div>
      `).join("");
    }

    function renderLeaderboard() {
      const container = document.getElementById("leaderboardContainer");
      if (!appState.teams.length) {
        container.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-xs text-slate-400">Chưa có đội.</div>`;
        return;
      }
      container.innerHTML = appState.teams.map((t, idx) => `
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <span class="w-8 h-8 rounded-full font-extrabold text-xs flex items-center justify-center ${idx === 0 ? 'bg-amber-400 text-slate-900' : (idx === 1 ? 'bg-slate-300' : 'bg-amber-700 text-white')}">#${idx + 1}</span>
            <div class="font-bold text-sm text-slate-800 flex items-center gap-1.5"><span class="w-3 h-3 rounded-full inline-block" style="background:${t.color}"></span>${t.name}</div>
          </div>
          <div class="text-lg font-extrabold text-indigo-700">${t.totalScore} đ</div>
        </div>
      `).join("");
    }

    function renderAdmin() {
      const container = document.getElementById("matchListAdmin");
      if (!appState.matches || !appState.matches.length) {
        container.innerHTML = `<div class="text-xs text-slate-400 italic">Chưa có trận đấu nào.</div>`;
        return;
      }
      container.innerHTML = appState.matches.map(m => `
        <div class="flex items-center justify-between p-2.5 rounded-xl border ${m.status === 'Đang diễn ra' ? 'border-emerald-300 bg-emerald-50' : 'border-slate-200 bg-slate-50'}">
          <div>
            <div class="text-xs font-bold text-slate-800">${m.name}</div>
            <div class="text-[11px] ${m.status === 'Đang diễn ra' ? 'text-emerald-600 font-bold' : 'text-slate-400'}">${m.status}</div>
          </div>
          ${m.status === 'Đang diễn ra' ? `<button onclick="endMatch('${m.id}')" class="bg-red-600 text-white px-2.5 py-1 rounded-lg text-[11px] font-bold">Kết thúc</button>` : ''}
        </div>
      `).join("");
    }

    function unlockAdmin() {
      if (document.getElementById("adminPinInput").value.trim() === ADMIN_PIN) {
        document.getElementById("adminLockScreen").classList.add("hidden");
        document.getElementById("adminContent").classList.remove("hidden");
        showToast("Mở khóa thành công!");
      } else {
        showToast("Sai mã PIN!", true);
        document.getElementById("adminPinInput").value = "";
      }
    }

    function lockAdminAgain() {
      document.getElementById("adminLockScreen").classList.remove("hidden");
      document.getElementById("adminContent").classList.add("hidden");
      document.getElementById("adminPinInput").value = "";
    }

    async function createNewTeam() {
      const tenDoi = document.getElementById("newTeamName").value.trim();
      const mauSac = document.getElementById("newTeamColor").value;
      if (!tenDoi) return showToast("Nhập tên đội!", true);
      const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "ADD_TEAM", tenDoi, mauSac }) });
      const r = await res.json();
      if (r.status === "success") {
        document.getElementById("newTeamName").value = "";
        appState = r.data;
        renderAll();
        showToast("Đã thêm đội!");
      }
    }

    async function createNewMatch() {
      const tenTran = document.getElementById("newMatchName").value.trim();
      if (!tenTran) return showToast("Nhập tên trận!", true);
      const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "CREATE_MATCH", tenTran }) });
      const r = await res.json();
      if (r.status === "success") {
        document.getElementById("newMatchName").value = "";
        appState = r.data;
        renderAll();
        showToast("Đã mở trận mới!");
      }
    }

    async function endMatch(idTran) {
      if (!confirm("Kết thúc trận này?")) return;
      const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "END_MATCH", idTran }) });
      const r = await res.json();
      if (r.status === "success") {
        appState = r.data;
        renderAll();
        showToast("Đã kết thúc trận!");
      }
    }

    // ĐÃ FIX HOÀN CHỈNH HÀM CHUYỂN TAB (HIỂN THỊ ĐẦY ĐỦ CẢ NHẬT KÝ, XẾP HẠNG VÀ QUẢN TRỊ)
    function switchTab(tab) {
      ["score", "feed", "leaderboard", "admin"].forEach(t => {
        document.getElementById("tab-" + t).classList.toggle("hidden", t !== tab);
        document.getElementById("nav-" + t).className = t === tab 
          ? "flex flex-col items-center text-indigo-600 font-bold text-xs" 
          : "flex flex-col items-center text-slate-400 font-medium text-xs";
      });

      if (tab === "admin") {
        const isUnlocked = !document.getElementById("adminContent").classList.contains("hidden");
        if (!isUnlocked) {
          document.getElementById("adminLockScreen").classList.remove("hidden");
          document.getElementById("adminContent").classList.add("hidden");
        }
      }
    }
  </script>
</body>
</html>
