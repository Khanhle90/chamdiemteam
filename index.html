<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Trọng Tài Team Building</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body { -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, sans-serif; }
    .turn-locked { opacity: 0.45; cursor: not-allowed; text-decoration: line-through; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen pb-20">

  <!-- HEADER -->
  <header class="bg-indigo-700 text-white px-4 py-3 shadow-md sticky top-0 z-30 flex items-center justify-between">
    <div>
      <h1 class="font-bold text-base tracking-wide uppercase flex items-center gap-2">
        <i class="fa-solid fa-stopwatch text-amber-300"></i> Chấm Điểm Team Building
      </h1>
      <p id="activeMatchLabel" class="text-xs text-indigo-200 mt-0.5">Đang tải trận đấu...</p>
    </div>
    <button onclick="fetchData(true)" class="bg-indigo-600 active:bg-indigo-800 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 border border-indigo-400">
      <i id="syncIcon" class="fa-solid fa-rotate"></i> Đồng bộ
    </button>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-md mx-auto p-3">

    <!-- TAB 1: MÀN HÌNH CHẤM ĐIỂM (MẶC ĐỊNH CHO TRỌNG TÀI) -->
    <section id="tab-score" class="space-y-4">
      <div class="bg-white rounded-2xl shadow-sm p-4 border border-slate-200 space-y-4">

        <!-- 1. CHỌN ĐỘI CHƠI (TỰ ĐỘNG NHỚ ĐỘI LẦN TRƯỚC NHƯNG KHÔNG KHÓA CỨNG) -->
        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="text-xs font-bold uppercase text-slate-600">1. Chọn Đội Chơi <span class="text-red-500">*</span></label>
            <span class="text-[11px] text-emerald-600 font-medium"><i class="fa-solid fa-mobile-screen"></i> Tự giữ đội sau khi Lưu</span>
          </div>
          <div id="teamButtonsContainer" class="grid grid-cols-2 gap-2">
            <!-- Render bằng JS -->
          </div>
        </div>

        <!-- 2. CHẾ ĐỘ CHẤM -->
        <div>
          <label class="block text-xs font-bold uppercase text-slate-600 mb-1.5">2. Chế Độ Chấm <span class="text-red-500">*</span></label>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" onclick="selectMode('Tính giờ')" id="mode-TinhGio"
              class="mode-btn py-2.5 px-2 rounded-xl font-bold text-xs border-2 transition flex flex-col items-center gap-1">
              <i class="fa-solid fa-stopwatch text-base"></i> Tính giờ
            </button>
            <button type="button" onclick="selectMode('Đếm số')" id="mode-DemSo"
              class="mode-btn py-2.5 px-2 rounded-xl font-bold text-xs border-2 transition flex flex-col items-center gap-1">
              <i class="fa-solid fa-layer-group text-base"></i> Đếm số
            </button>
            <button type="button" onclick="selectMode('Thêm điểm')" id="mode-ThemDiem"
              class="mode-btn py-2.5 px-2 rounded-xl font-bold text-xs border-2 transition flex flex-col items-center gap-1">
              <i class="fa-solid fa-circle-plus text-base"></i> Thêm điểm
            </button>
          </div>
        </div>

        <!-- 3. LƯỢT CHƠI (CHỈ HIỆN KHI TÍNH GIỜ / ĐẾM SỐ, KHÓA LƯỢT ĐÃ DÙNG & BẮT BUỘC TĂNG DẦN) -->
        <div id="turnSection">
          <div class="flex justify-between items-center mb-1.5">
            <label class="text-xs font-bold uppercase text-slate-600">3. Thứ Tự Lượt Chơi <span class="text-red-500">*</span></label>
            <span id="turnStatusHint" class="text-[11px] text-indigo-600 font-medium">Lượt đã chấm sẽ tự khóa</span>
          </div>
          <div id="turnButtonsContainer" class="grid grid-cols-6 gap-1.5">
            <!-- Render L1 -> L6 bằng JS -->
          </div>
        </div>

        <!-- 4. NÚT PHẠM QUY (CHỈ HIỆN KHI TÍNH GIỜ / ĐẾM SỐ) -->
        <div id="foulSection" class="pt-1">
          <label class="flex items-center justify-between p-3 rounded-xl border-2 border-red-200 bg-red-50/60 cursor-pointer">
            <div class="flex items-center gap-2.5">
              <i class="fa-solid fa-triangle-exclamation text-red-600 text-lg"></i>
              <div>
                <div class="text-sm font-bold text-red-700">Đánh dấu Phạm Quy (0 điểm)</div>
                <div class="text-[11px] text-red-500">Tự động ẩn ô nhập kết quả & gán 0đ</div>
              </div>
            </div>
            <input type="checkbox" id="foulCheckbox" onchange="toggleFoul()" class="w-5 h-5 accent-red-600 rounded" />
          </label>
        </div>

        <!-- 5A. NHẬP THỜI GIAN & SỐ NGƯỜI (CHẾ ĐỘ TÍNH GIỜ & KHÔNG PHẠM QUY) -->
        <div id="timeInputsSection" class="space-y-3">
          <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Thời gian thi đấu (Giây) <span class="text-red-500">*</span></label>
            <input type="number" step="0.01" id="inputSeconds" placeholder="VD: 45.5"
              class="w-full px-3.5 py-3 text-lg font-bold rounded-xl border-2 border-slate-300 focus:border-indigo-600 focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">
              Số lượng thành viên tham gia <span class="text-slate-400 font-normal">(Không bắt buộc)</span>
            </label>
            <input type="number" id="inputMembers" placeholder="Để trống nếu tính tổng thời gian cả đội"
              class="w-full px-3.5 py-2.5 text-sm font-semibold rounded-xl border-2 border-slate-200 focus:border-indigo-600 focus:outline-none" />
          </div>
        </div>

        <!-- 5B. NHẬP SỐ LƯỢNG ĐẾM (CHẾ ĐỘ ĐẾM SỐ & KHÔNG PHẠM QUY) -->
        <div id="countInputsSection" class="hidden">
          <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Số lượng đếm được <span class="text-red-500">*</span></label>
          <input type="number" id="inputCount" placeholder="Nhập số lượng vật phẩm/bóng..."
            class="w-full px-3.5 py-3 text-lg font-bold rounded-xl border-2 border-slate-300 focus:border-indigo-600 focus:outline-none" />
        </div>

        <!-- 5C. NHẬP ĐIỂM TRỰC TIẾP (CHẾ ĐỘ THÊM ĐIỂM) -->
        <div id="directPointsSection" class="hidden space-y-2">
          <label class="block text-xs font-bold uppercase text-slate-600">Số điểm cộng trực tiếp <span class="text-red-500">*</span></label>
          <div class="grid grid-cols-4 gap-2 mb-2">
            <button type="button" onclick="setDirectPoint(10)" class="py-2 bg-emerald-50 border border-emerald-300 rounded-lg font-bold text-emerald-700 text-xs">+10đ</button>
            <button type="button" onclick="setDirectPoint(20)" class="py-2 bg-emerald-50 border border-emerald-300 rounded-lg font-bold text-emerald-700 text-xs">+20đ</button>
            <button type="button" onclick="setDirectPoint(30)" class="py-2 bg-emerald-50 border border-emerald-300 rounded-lg font-bold text-emerald-700 text-xs">+30đ</button>
            <button type="button" onclick="setDirectPoint(50)" class="py-2 bg-emerald-50 border border-emerald-300 rounded-lg font-bold text-emerald-700 text-xs">+50đ</button>
          </div>
          <input type="number" id="inputDirectPoints" value="10"
            class="w-full px-3.5 py-3 text-lg font-bold rounded-xl border-2 border-slate-300 focus:border-indigo-600 focus:outline-none" />
        </div>

        <!-- NÚT GỬI ĐIỂM -->
        <button type="button" id="submitBtn" onclick="submitScore()"
          class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold rounded-xl shadow-md text-base flex items-center justify-center gap-2 transition">
          <i class="fa-solid fa-paper-plane"></i> LƯU ĐIỂM NGAY
        </button>

      </div>
    </section>

    <!-- TAB 2: NHẬT KÝ CHẤM ĐIỂM LIVE FEED (MỖI LẦN + ĐIỂM LÀ 1 DÒNG) -->
    <section id="tab-feed" class="hidden space-y-2.5">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-xs font-bold uppercase text-slate-500">Dòng chảy điểm trực tiếp (Mới nhất lên đầu)</h2>
        <span id="logCountBadge" class="text-xs bg-indigo-100 text-indigo-700 font-bold px-2 py-0.5 rounded-full">0 lượt</span>
      </div>
      <div id="liveFeedContainer" class="space-y-2">
        <!-- Render bằng JS -->
      </div>
    </section>

    <!-- TAB 3: BẢNG XẾP HẠNG TỔNG -->
    <section id="tab-leaderboard" class="hidden space-y-3">
      <h2 class="text-xs font-bold uppercase text-slate-500 px-1">Bảng xếp hạng tổng điểm thời gian thực</h2>
      <div id="leaderboardContainer" class="space-y-2.5">
        <!-- Render bằng JS -->
      </div>
    </section>

    <!-- TAB 4: QUẢN TRỊ TRẬN ĐẤU & ĐỘI CHƠI -->
    <section id="tab-admin" class="hidden space-y-4">
      <!-- Thêm đội chơi mới (Tự động bắt vào trận Đang diễn ra) -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
        <h3 class="font-bold text-sm text-slate-800"><i class="fa-solid fa-users-gear text-indigo-600 mr-1"></i> Thêm Đội Chơi (Vào trận Đang diễn ra)</h3>
        <div class="flex gap-2">
          <input type="text" id="newTeamName" placeholder="Nhập tên đội mới..." class="flex-1 px-3 py-2 border rounded-xl text-sm" />
          <input type="color" id="newTeamColor" value="#ef4444" class="w-11 h-10 p-1 border rounded-xl cursor-pointer" />
          <button onclick="createNewTeam()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-bold">Thêm</button>
        </div>
      </div>

      <!-- Tạo / Kết thúc trận đấu -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
        <h3 class="font-bold text-sm text-slate-800"><i class="fa-solid fa-flag-checkered text-indigo-600 mr-1"></i> Quản Lý Trận Đấu</h3>
        <div class="flex gap-2">
          <input type="text" id="newMatchName" placeholder="Tên chương trình / trận mới..." class="flex-1 px-3 py-2 border rounded-xl text-sm" />
          <button onclick="createNewMatch()" class="bg-emerald-600 text-white px-3.5 py-2 rounded-xl text-xs font-bold">Mở trận mới</button>
        </div>
        <div id="matchListAdmin" class="space-y-2 pt-2"></div>
      </div>
    </section>

  </main>

  <!-- TOAST THÔNG BÁO NHANH -->
  <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg hidden z-50"></div>

  <!-- BOTTOM NAVIGATION (GIỐNG APPSHEET) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around py-2 z-40 max-w-md mx-auto">
    <button onclick="switchTab('score')" id="nav-score" class="flex flex-col items-center text-indigo-600 font-bold text-xs">
      <i class="fa-solid fa-pen-to-square text-lg mb-0.5"></i> Chấm điểm
    </button>
    <button onclick="switchTab('feed')" id="nav-feed" class="flex flex-col items-center text-slate-400 font-medium text-xs">
      <i class="fa-solid fa-bolt text-lg mb-0.5"></i> Nhật ký Live
    </button>
    <button onclick="switchTab('leaderboard')" id="nav-leaderboard" class="flex flex-col items-center text-slate-400 font-medium text-xs">
      <i class="fa-solid fa-trophy text-lg mb-0.5"></i> Xếp hạng
    </button>
    <button onclick="switchTab('admin')" id="nav-admin" class="flex flex-col items-center text-slate-400 font-medium text-xs">
      <i class="fa-solid fa-Sliders text-lg mb-0.5"></i> Quản trị
    </button>
  </nav>

  <script>
    // =========================================================================
    // DÁN ĐƯỜNG LINK WEB APP URL CỦA GOOGLE APPS SCRIPT VÀO DÒNG DƯỚI ĐÂY:
    // =========================================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwMIJ3xfm4dSayXA2-RrBJmF4BO_Ku2-uXA5UPGDi0Zt4eutGnqz1p9YX2DPmlFI16g/exec";

    const ALL_TURNS = ["L1", "L2", "L3", "L4", "L5", "L6"];
    let appState = { activeMatch: null, matches: [], teams: [], logs: [] };
    let selectedTeamId = "";
    let selectedMode = "Tính giờ";
    let selectedTurn = "L1";

    // Định danh thiết bị trọng tài không cần đăng nhập (Tương đương CONTEXT("Device"))
    let deviceId = localStorage.getItem("tb_device_id");
    if (!deviceId) {
      deviceId = "DEV_" + Math.random().toString(36).substring(2, 10).toUpperCase();
      localStorage.setItem("tb_device_id", deviceId);
    }

    window.addEventListener("DOMContentLoaded", () => {
      selectMode("Tính giờ");
      fetchData(true);
      // Tự động làm mới dữ liệu ngầm mỗi 8 giây
      setInterval(() => fetchData(false), 8000);
    });

    function showToast(msg, isError = false) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = `fixed top-16 left-1/2 -translate-x-1/2 text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-lg z-50 ${isError ? 'bg-red-600' : 'bg-emerald-600'}`;
      t.classList.remove("hidden");
      setTimeout(() => t.classList.add("hidden"), 2500);
    }

    async function fetchData(showSpinner = false) {
      if (SCRIPT_URL.includes("DÁN_LINK")) {
        document.getElementById("activeMatchLabel").textContent = "Chưa gắn link SCRIPT_URL trong code!";
        return;
      }
      const icon = document.getElementById("syncIcon");
      if (showSpinner) icon.classList.add("fa-spin");

      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        appState = data;
        renderAll();
      } catch (e) {
        console.error(e);
      } finally {
        if (showSpinner) icon.classList.remove("fa-spin");
      }
    }

    function renderAll() {
      const match = appState.activeMatch;
      document.getElementById("activeMatchLabel").textContent = match
        ? `Trận đang mở: ${match.name}`
        : "Hiện không có trận đấu nào Đang diễn ra";

      // Khôi phục đội đã chọn gần nhất trên máy này (Initial Value nhưng không khóa cứng)
      if (match) {
        const savedTeam = localStorage.getItem("tb_team_" + match.id);
        if (savedTeam && appState.teams.some(t => t.id === savedTeam)) {
          selectedTeamId = savedTeam;
        } else if (!selectedTeamId && appState.teams.length > 0) {
          selectedTeamId = appState.teams[0].id;
        }
      }

      renderTeamButtons();
      renderTurnButtons();
      renderLiveFeed();
      renderLeaderboard();
      renderAdmin();
    }

    // 1. RENDER NÚT CHỌN ĐỘI (CHO PHÉP ĐỔI BẤT CỨ LÚC NÀO, CHẤM XONG VẪN GIỮ NGUYÊN)
    function renderTeamButtons() {
      const container = document.getElementById("teamButtonsContainer");
      if (!appState.teams.length) {
        container.innerHTML = `<div class="col-span-2 text-xs text-slate-400 italic">Chưa có đội chơi nào trong trận này.</div>`;
        return;
      }
      container.innerHTML = appState.teams.map(t => {
        const isSelected = t.id === selectedTeamId;
        return `
          <button type="button" onclick="selectTeam('${t.id}')"
            class="p-2.5 rounded-xl border-2 text-left transition flex items-center justify-between ${
              isSelected ? 'border-indigo-600 bg-indigo-50 text-indigo-900 font-bold shadow-sm' : 'border-slate-200 bg-white text-slate-700 font-medium'
            }">
            <span class="truncate text-xs flex items-center gap-1.5">
              <span class="w-3 h-3 rounded-full inline-block shrink-0" style="background:${t.color}"></span>
              ${t.name}
            </span>
            ${isSelected ? '<i class="fa-solid fa-circle-check text-indigo-600 text-sm"></i>' : ''}
          </button>
        `;
      }).join("");
    }

    function selectTeam(idDoi) {
      selectedTeamId = idDoi;
      if (appState.activeMatch) {
        localStorage.setItem("tb_team_" + appState.activeMatch.id, idDoi);
      }
      renderTeamButtons();
      renderTurnButtons();
    }

    // 2. CHỌN CHẾ ĐỘ CHẤM
    function selectMode(mode) {
      selectedMode = mode;
      const modes = [
        { id: "mode-TinhGio", name: "Tính giờ" },
        { id: "mode-DemSo", name: "Đếm số" },
        { id: "mode-ThemDiem", name: "Thêm điểm" }
      ];
      modes.forEach(m => {
        const btn = document.getElementById(m.id);
        if (m.name === mode) {
          btn.className = "mode-btn py-2.5 px-2 rounded-xl font-bold text-xs border-2 border-indigo-600 bg-indigo-600 text-white shadow-sm flex flex-col items-center gap-1";
        } else {
          btn.className = "mode-btn py-2.5 px-2 rounded-xl font-bold text-xs border-2 border-slate-200 bg-slate-50 text-slate-600 flex flex-col items-center gap-1";
        }
      });

      const isRankedMode = (mode === "Tính giờ" || mode === "Đếm số");
      document.getElementById("turnSection").classList.toggle("hidden", !isRankedMode);
      document.getElementById("foulSection").classList.toggle("hidden", !isRankedMode);

      if (!isRankedMode) {
        document.getElementById("foulCheckbox").checked = false;
      }
      updateInputVisibility();
      renderTurnButtons();
    }

    // 3. KIỂM SOÁT CHẶT LƯỢT CHƠI L1 -> L6 (KHÓA LƯỢT ĐÃ DÙNG, KHÔNG ẨN, BẮT BUỘC LƯỢT SAU LỚN HƠN LƯỢT TRƯỚC)
    function getNextAllowedTurn() {
      if (!selectedTeamId || selectedMode === "Thêm điểm") return "L1";
      const usedTurns = appState.logs
        .filter(l => l.idDoi === selectedTeamId && l.cheDo === selectedMode)
        .map(l => l.luotChoi);

      let maxUsedIndex = -1;
      usedTurns.forEach(t => {
        const idx = ALL_TURNS.indexOf(t);
        if (idx > maxUsedIndex) maxUsedIndex = idx;
      });

      const nextIndex = maxUsedIndex + 1;
      return nextIndex < ALL_TURNS.length ? ALL_TURNS[nextIndex] : null;
    }

    function renderTurnButtons() {
      const container = document.getElementById("turnButtonsContainer");
      const nextTurn = getNextAllowedTurn();
      selectedTurn = nextTurn || "";

      const usedTurns = appState.logs
        .filter(l => l.idDoi === selectedTeamId && l.cheDo === selectedMode)
        .map(l => l.luotChoi);

      let maxUsedIndex = -1;
      usedTurns.forEach(t => {
        const idx = ALL_TURNS.indexOf(t);
        if (idx > maxUsedIndex) maxUsedIndex = idx;
      });

      container.innerHTML = ALL_TURNS.map((turn, idx) => {
        const isUsedOrPassed = idx <= maxUsedIndex;
        const isNextAllowed = (turn === nextTurn);
        const isFutureLocked = idx > maxUsedIndex + 1;

        if (isUsedOrPassed) {
          // Đã chấm: Khóa lại (không ẩn đi)
          return `
            <button type="button" disabled
              class="turn-locked py-2.5 rounded-xl border border-slate-300 bg-slate-200 text-slate-500 font-bold text-xs flex flex-col items-center">
              <span>${turn}</span>
              <i class="fa-solid fa-lock text-[10px] mt-0.5"></i>
            </button>
          `;
        } else if (isNextAllowed) {
          // Lượt hợp lệ tiếp theo (Bắt buộc lớn hơn lượt trước)
          return `
            <button type="button" onclick="selectedTurn='${turn}'"
              class="py-2.5 rounded-xl border-2 border-indigo-600 bg-indigo-600 text-white font-bold text-xs shadow-sm flex flex-col items-center">
              <span>${turn}</span>
              <i class="fa-solid fa-check text-[10px] mt-0.5"></i>
            </button>
          `;
        } else if (isFutureLocked) {
          // Chưa tới lượt (Chặn nhảy cóc)
          return `
            <button type="button" disabled
              class="opacity-50 cursor-not-allowed py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-400 font-bold text-xs flex flex-col items-center">
              <span>${turn}</span>
              <i class="fa-solid fa-hourglass-half text-[10px] mt-0.5"></i>
            </button>
          `;
        }
      }).join("");

      const hint = document.getElementById("turnStatusHint");
      hint.textContent = nextTurn ? `Đang mở: ${nextTurn}` : "Đội này đã hoàn thành đủ 6 lượt!";
    }

    function toggleFoul() {
      updateInputVisibility();
    }

    function updateInputVisibility() {
      const isFoul = document.getElementById("foulCheckbox").checked;
      document.getElementById("timeInputsSection").classList.toggle("hidden", !(selectedMode === "Tính giờ" && !isFoul));
      document.getElementById("countInputsSection").classList.toggle("hidden", !(selectedMode === "Đếm số" && !isFoul));
      document.getElementById("directPointsSection").classList.toggle("hidden", selectedMode !== "Thêm điểm");
    }

    function setDirectPoint(val) {
      document.getElementById("inputDirectPoints").value = val;
    }

    // 4. GỬI ĐIỂM & TỰ ĐỘNG QUAY LẠI MÀN HÌNH CHẤM ĐIỂM CÙNG ĐỘI ĐÃ CHỌN
    async function submitScore() {
      if (!appState.activeMatch) return showToast("Chưa có trận đấu Đang diễn ra!", true);
      if (!selectedTeamId) return showToast("Vui lòng chọn Đội chơi!", true);

      const isFoul = document.getElementById("foulCheckbox").checked;
      let thoiGianGiay = 0, soThanhVien = 0, soLuongDem = 0, diemTrucTiep = 0;

      if (selectedMode === "Tính giờ" || selectedMode === "Đếm số") {
        if (!selectedTurn) return showToast("Đội này đã hết lượt chơi (L1-L6)!", true);
      }

      if (selectedMode === "Tính giờ" && !isFoul) {
        thoiGianGiay = parseFloat(document.getElementById("inputSeconds").value);
        soThanhVien = parseInt(document.getElementById("inputMembers").value) || 0;
        if (!thoiGianGiay || thoiGianGiay <= 0) return showToast("Vui lòng nhập thời gian hợp lệ!", true);
      } else if (selectedMode === "Đếm số" && !isFoul) {
        soLuongDem = parseInt(document.getElementById("inputCount").value);
        if (!soLuongDem || soLuongDem <= 0) return showToast("Vui lòng nhập số lượng đếm!", true);
      } else if (selectedMode === "Thêm điểm") {
        diemTrucTiep = parseInt(document.getElementById("inputDirectPoints").value);
        if (isNaN(diemTrucTiep) || diemTrucTiep === 0) return showToast("Vui lòng nhập số điểm cộng!", true);
      }

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ĐANG LƯU ĐIỂM...`;

      try {
        // Lưu nhớ đội vừa chấm trên thiết bị
        localStorage.setItem("tb_team_" + appState.activeMatch.id, selectedTeamId);

        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "ADD_SCORE",
            idDoi: selectedTeamId,
            cheDo: selectedMode,
            luotChoi: selectedMode === "Thêm điểm" ? "" : selectedTurn,
            thoiGianGiay: thoiGianGiay,
            soThanhVien: soThanhVien,
            soLuongDem: soLuongDem,
            phamQuy: isFoul,
            diemTrucTiep: diemTrucTiep,
            trongTai: deviceId
          })
        });

        const result = await res.json();
        if (result.status === "success") {
          appState = result.data;
          // Reset ô nhập số nhưng GIỮ NGUYÊN ĐỘI & MÀN HÌNH CHẤM ĐIỂM
          document.getElementById("inputSeconds").value = "";
          document.getElementById("inputMembers").value = "";
          document.getElementById("inputCount").value = "";
          document.getElementById("foulCheckbox").checked = false;
          updateInputVisibility();
          renderAll();
          showToast("Đã lưu điểm thành công!");
          switchTab("score"); // Luôn trả về giao diện Chấm điểm
        } else {
          showToast(result.message || "Lỗi khi lưu!", true);
        }
      } catch (err) {
        showToast("Lỗi kết nối mạng!", true);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> LƯU ĐIỂM NGAY`;
      }
    }

    // 5. RENDER NHẬT KÝ LIVE FEED (MỖI LẦN + ĐIỂM LÀ 1 DÒNG)
    function renderLiveFeed() {
      const container = document.getElementById("liveFeedContainer");
      document.getElementById("logCountBadge").textContent = `${appState.logs.length} lượt`;

      if (!appState.logs.length) {
        container.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-xs text-slate-400">Chưa có lượt chấm điểm nào trong trận này.</div>`;
        return;
      }

      container.innerHTML = appState.logs.map(log => {
        let subDetail = "";
        if (log.cheDo === "Tính giờ" && !log.phamQuy) {
          subDetail = `TB: ${log.tgTrungBinh}s (${log.thoiGianGiay}s${log.soThanhVien > 0 ? ' / ' + log.soThanhVien + ' người' : ''}) • Hạng ${log.hangThuThach}`;
        } else if (log.cheDo === "Đếm số" && !log.phamQuy) {
          subDetail = `Đếm được: ${log.soLuongDem} • Hạng ${log.hangThuThach}`;
        }

        return `
          <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
            <div class="space-y-0.5">
              <div class="font-bold text-sm text-slate-800 flex items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full inline-block" style="background:${log.mauSac}"></span>
                ${log.tenDoi}
              </div>
              <div class="text-xs font-semibold ${log.phamQuy ? 'text-red-600' : 'text-indigo-600'}">
                ${log.hienThiNhatKy}
              </div>
              ${subDetail ? `<div class="text-[11px] text-slate-400">${subDetail}</div>` : ''}
            </div>
            <div class="text-right">
              <span class="inline-block px-3 py-1 rounded-xl font-extrabold text-sm ${
                log.phamQuy ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'
              }">
                ${log.phamQuy ? '0đ' : '+' + log.diemDatDuoc + 'đ'}
              </span>
            </div>
          </div>
        `;
      }).join("");
    }

    // 6. RENDER BẢNG XẾP HẠNG TỔNG
    function renderLeaderboard() {
      const container = document.getElementById("leaderboardContainer");
      if (!appState.teams.length) {
        container.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-xs text-slate-400">Chưa có dữ liệu đội chơi.</div>`;
        return;
      }

      container.innerHTML = appState.teams.map((t, idx) => {
        const badgeColor = idx === 0 ? "bg-amber-400 text-slate-900" : (idx === 1 ? "bg-slate-300 text-slate-800" : (idx === 2 ? "bg-amber-700 text-white" : "bg-slate-100 text-slate-600"));
        return `
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <span class="w-8 h-8 rounded-full font-extrabold text-xs flex items-center justify-center ${badgeColor}">
                #${idx + 1}
              </span>
              <div>
                <div class="font-bold text-sm text-slate-800 flex items-center gap-1.5">
                  <span class="w-3 h-3 rounded-full inline-block" style="background:${t.color}"></span>
                  ${t.name}
                </div>
              </div>
            </div>
            <div class="text-lg font-extrabold text-indigo-700">${t.totalScore} đ</div>
          </div>
        `;
      }).join("");
    }

    // 7. QUẢN TRỊ TRẬN ĐẤU & ĐỘI CHƠI
    function renderAdmin() {
      const container = document.getElementById("matchListAdmin");
      container.innerHTML = appState.matches.map(m => `
        <div class="flex items-center justify-between p-2.5 rounded-xl border ${m.status === 'Đang diễn ra' ? 'border-emerald-300 bg-emerald-50' : 'border-slate-200 bg-slate-50'}">
          <div>
            <div class="text-xs font-bold text-slate-800">${m.name}</div>
            <div class="text-[11px] ${m.status === 'Đang diễn ra' ? 'text-emerald-600 font-bold' : 'text-slate-400'}">${m.status}</div>
          </div>
          ${m.status === 'Đang diễn ra' ? `
            <button onclick="endMatch('${m.id}')" class="bg-red-600 text-white px-2.5 py-1 rounded-lg text-[11px] font-bold">
              Kết thúc trận
            </button>
          ` : ''}
        </div>
      `).join("");
    }

    async function createNewTeam() {
      const name = document.getElementById("newTeamName").value.trim();
      const color = document.getElementById("newTeamColor").value;
      if (!name) return showToast("Nhập tên đội!", true);
      showToast("Đang thêm đội...");
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "ADD_TEAM", tenDoi: name, mauSac: color })
      });
      const result = await res.json();
      if (result.status === "success") {
        document.getElementById("newTeamName").value = "";
        appState = result.data;
        renderAll();
        showToast("Đã thêm đội vào trận Đang diễn ra!");
      }
    }

    async function createNewMatch() {
      const name = document.getElementById("newMatchName").value.trim();
      if (!name) return showToast("Nhập tên trận đấu mới!", true);
      showToast("Đang tạo trận mới...");
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "CREATE_MATCH", tenTran: name })
      });
      const result = await res.json();
      if (result.status === "success") {
        document.getElementById("newMatchName").value = "";
        appState = result.data;
        selectedTeamId = "";
        renderAll();
        showToast("Đã mở trận đấu mới!");
      }
    }

    async function endMatch(idTran) {
      if (!confirm("Kết thúc trận này để cô lập dữ liệu và dọn rác vào ban đêm?")) return;
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "END_MATCH", idTran: idTran })
      });
      const result = await res.json();
      if (result.status === "success") {
        appState = result.data;
        renderAll();
        showToast("Đã kết thúc trận đấu!");
      }
    }

    function switchTab(tab) {
      ["score", "feed", "leaderboard", "admin"].forEach(t => {
        document.getElementById("tab-" + t).classList.toggle("hidden", t !== tab);
        const nav = document.getElementById("nav-" + t);
        nav.className = t === tab
          ? "flex flex-col items-center text-indigo-600 font-bold text-xs"
          : "flex flex-col items-center text-slate-400 font-medium text-xs";
      });
    }
  </script>
</body>
</html>
